# Stock Card & Inventory Management System — production stack.
#   docker compose up -d --build     start (or update after code changes)
#   docker compose down              stop (data is kept)
#   docker compose logs -f app       view application logs
#
# Settings come from .env. Docker-specific values (database passwords) are the
# DOCKER_DB_* variables at the end of .env.
name: stock-card

x-laravel: &laravel
  build: .
  image: stock-card-app
  restart: unless-stopped
  env_file: .env
  volumes:
    # Receipt attachments and e-signatures, kept on this PC in storage/app.
    - ./storage/app:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy

x-laravel-env: &laravel-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: stock_card
  DB_USERNAME: stock_card
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
  LOG_STACK: single,stderr

services:
  app:
    <<: *laravel
    ports:
      - "8000:8080"
    environment:
      <<: *laravel-env
      AUTORUN_ENABLED: "true"

  scheduler:
    <<: *laravel
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *laravel-env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stock_card
      MYSQL_USER: stock_card
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
